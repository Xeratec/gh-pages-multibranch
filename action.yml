# but please link to the source if it's useful for people to more
# easily reuse.

name: gh-pages multibranch
description: Manage multiple branches and tags in gh-pages

inputs:
  directory:
    description: 'Directory to multiplex in, also source'
    required: true
    default: 'public'
  cname:
    description: 'CNAME of the repo, if any (default autodetect from repo)'
    default: ''
  default_branch:
    description: "Default branch of the repo (to get the default site)"
    default: 'main'
  publish_branch:
    description: "GitHub Pages branch"
    default: 'gh-pages'

runs:
  using: "composite"
  steps:
    - name: Make temporary directory
      id: mktmpdir
      shell: bash
      run: |
        set -x
        echo "tmpdir=$(mktemp -d)" >> $GITHUB_OUTPUT

    - name: Find CNAME
      id: cname
      shell: bash
      env:
        inputs_cname: ${{inputs.cname}}
        directory: ${{inputs.directory}}
      run: |
        set -x
        if [ -n "${inputs_cname}" ]; then
          echo "cname=${inputs_cname}" >> $GITHUB_OUTPUT
        elif [ -e "${directory}/CNAME" ]; then
          echo "cname=$(cat ${directory}/CNAME)" >> $GITHUB_OUTPUT
        elif [ -e CNAME ]; then
          echo "cname=$(cat CNAME)" >> $GITHUB_OUTPUT
        else
          echo "cname=" >> $GITHUB_OUTPUT
        fi

    - name: Clone old gh-pages
      shell: bash
      env:
        publish_branch: ${{inputs.publish_branch}}
        tmpdir: ${{steps.mktmpdir.outputs.tmpdir}}
      run: |
        set -x
        git fetch
        if git rev-parse --verify "remotes/origin/${publish_branch}"; then
          git branch -- "${publish_branch}" "remotes/origin/${publish_branch}"
          git clone . "--branch=${publish_branch}" ${tmpdir}
        fi
        rm -rf "${tmpdir}/.git"
        mkdir -p "${tmpdir}/branch" "${tmpdir}/tag"

    - name: Deploy new build
      id: deploy
      shell: bash
      env:
        ref: ${{github.ref}}
        ref_type: ${{github.ref_type}}
        default_branch: ${{inputs.default_branch}}
        tmpdir: ${{steps.mktmpdir.outputs.tmpdir}}
        directory: ${{inputs.directory}}
        cname: ${{steps.cname.outputs.cname}}
      run: |
        set -x
        if [[ "$ref" == "refs/heads/${default_branch}" ]]; then
          target_dir="${tmpdir}"
          find "${tmpdir}" -mindepth 1 ! -path './branch*' ! -path './tag*' -delete
          rsync -raiv "${directory}/" "$target_dir/"
          preview_path=""
        elif [[ "$ref" =~ ^refs/heads/(.+)$ ]]; then
          branch_name=${BASH_REMATCH[1]}
          branch_dir="${branch_name//\//--}"
          target_dir="${tmpdir}/branch/${branch_dir}"
          rm -rf "$target_dir"
          rsync -raiv "${directory}/" "$target_dir/"
          preview_path="branch/${branch_dir}/"
        elif [[ "$ref" =~ ^refs/tags/(.+)$ ]]; then
          tag_name=${BASH_REMATCH[1]}
          tag_dir="${tag_name//\//--}"
          target_dir="${tmpdir}/tag/${tag_dir}"
          rm -rf "$target_dir"
          rsync -raiv "${directory}/" "$target_dir/"
          preview_path="tag/${tag_dir}/"
        fi

        site_root="https://${cname:-${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
        preview_link="$site_root/"
        echo "preview_link=${preview_link}" >> $GITHUB_OUTPUT
        echo "site_root=${site_root}" >> $GITHUB_OUTPUT
        echo ::notice "title=Preview link::Site available at ${preview_link}"

    - name: Clean old branches and tags
      shell: bash
      env:
        tmpdir: ${{steps.mktmpdir.outputs.tmpdir}}
      run: |
        set -x
        for brdir in ${tmpdir}/branch/*; do
          [ ! -e "$brdir" ] && continue
          brname=${brdir##*/}
          brname=${brname//--/\/}
          git rev-parse --verify "remotes/origin/$brname" || rm -rf "$brdir"
        done
        for tagdir in ${tmpdir}/tag/*; do
          [ ! -e "$tagdir" ] && continue
          tagname=${tagdir##*/}
          tagname=${tagname//--/\/}
          git rev-parse --verify "refs/tags/$tagname" || rm -rf "$tagdir"
        done

    - name: Generate versions.html
      shell: bash
      env:
        tmpdir: ${{steps.mktmpdir.outputs.tmpdir}}
        cname: ${{steps.cname.outputs.cname}}
        site_root: ${{steps.deploy.outputs.site_root}}
      run: |
        set -x
        {
          echo "<html><body><h1>Deployed Versions</h1><ul>"
          echo "<li><a href=\"${site_root}\">Default Branch (${{inputs.default_branch}})</a></li>"
          for path in branch tag; do
            for dir in ${tmpdir}/$path/*; do
              [ ! -e "$dir" ] && continue
              name=$(basename "$dir")
              url="$site_root/$path/$name/"
              echo "<li><a href=\"$url\">$path: ${name//--/\/}</a></li>"
            done
          done
          echo "</ul></body></html>"
        } > "${tmpdir}/versions.html"

    - name: Copy multipages directory back
      shell: bash
      env:
        directory: ${{inputs.directory}}
        tmpdir: ${{steps.mktmpdir.outputs.tmpdir}}
      run: |
        set -x
        rm -rf "${directory}"
        rsync -raiv "${tmpdir}/" "${directory}/"

    - name: Generate preview summary
      shell: bash
      env:
        preview_link: ${{steps.deploy.outputs.preview_link}}
        site_root: ${{steps.deploy.outputs.site_root}}
      run: |
        set -x
        cat << EOF >> $GITHUB_STEP_SUMMARY
        # Preview link
        Preview this site at <${preview_link}> .
        You can also find the versions at <${site_root}/versions.html> .
        EOF